name: ban-watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright && playwright install --with-deps chromium
      - run: python margonem_ban_watch.py --once
        env:
          WATCHED: ${{ secrets.WATCHED }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          API_URL: ${{ secrets.API_URL }}
      - run: |
          git config user.name "ban-bot"
          git config user.email "ban-bot@users.noreply.github.com"
          git add seen_bans.json
          git commit -m "state" && git push || true
